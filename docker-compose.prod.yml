version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-medflow_prod_db}
      POSTGRES_USER: ${DB_USER:-medflow_prod_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecureProductionPassword123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medflow_prod_user} -d ${DB_NAME:-medflow_prod_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medflow_internal

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - medflow_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env.production
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - medflow_internal
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - medflow_internal

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  medflow_internal:
    driver: bridge

